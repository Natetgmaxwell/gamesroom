name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Foundation tests + parse checks
        run: ./build-and-run-tests.sh

      - name: Xcode project verification
        run: python3 scripts/verify-xcode-project.py

      - name: SwiftUI parse check
        run: bash scripts/parse-check-swiftui.sh
