# xcodegen project spec for Games Room.
#
# ADDED 2026-09-10, migrating off a hand-written project.pbxproj. The
# hand-written file is the origin of the eight-defect catalogue in the
# `ios-build-verification-outside-xcode` skill (phantom "X 2.swift" refs,
# bare-filename PBXFileReference paths, unregistered sources, unwired
# xcconfig, ...). Generating the project from this file retires that whole
# class: every source is picked up by directory glob, so a new Swift file
# can never be "on disk but not in the project" again.
#
# Regenerate with:  /opt/homebrew/bin/xcodegen generate
# Never hand-edit GamesRoom.xcodeproj — it is a build artifact of this file.
#
# Defect this migration fixes on the way past: the hand-written project
# embedded GamesRoomWatch.app via an "Embed Watch Content" phase but declared
# NO target dependency on GamesRoomWatch, so the watch app could be embedded
# stale (or missing) depending on build order. xcodegen derives the
# dependency from the embed relationship.

name: GamesRoom

options:
  bundleIdPrefix: com.gamesroom
  createIntermediateGroups: true
  generateEmptyDirectories: true
  deploymentTarget:
    iOS: "26.0"
    watchOS: "11.0"

# Config.xcconfig carries SUPABASE_HOST / SUPABASE_ANON_KEY and is gitignored.
# It was wired as a baseConfigurationReference at project level AND on the app
# target in the hand-written project; both are reproduced here.
configFiles:
  Debug: GamesRoom/Config.xcconfig
  Release: GamesRoom/Config.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.53.0"

settings:
  base:
    DEVELOPMENT_TEAM: "37S7KT7W83"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "12"

targets:

  GamesRoom:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GamesRoom
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "Config.xcconfig"
          # GamesRoom/Fonts/ holds byte-identical duplicates of three files
          # that already sit at GamesRoom/ root (Fraunces-Italic.ttf,
          # Fraunces-Regular.ttf, OFL.txt). The hand-written project referenced
          # only the ROOT copies by bare filename, so the directory was dead
          # weight and nobody noticed. A directory glob picks up both and the
          # build fails with "Multiple commands produce ... Fraunces-Italic.ttf".
          # Info.plist's UIAppFonts lists the root copies. Safe to delete the
          # Fonts/ directory entirely; excluded here so the migration is
          # non-destructive.
          - "Fonts"
    configFiles:
      Debug: GamesRoom/Config.xcconfig
      Release: GamesRoom/Config.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamesroom.app
        PRODUCT_NAME: GamesRoom
        INFOPLIST_FILE: GamesRoom/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: GamesRoom/GamesRoom.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        SKIP_INSTALL: "NO"
    dependencies:
      - package: Supabase
        product: Supabase
      - target: GamesRoomWidgets
      # GamesRoomWatch is deliberately NOT declared as a dependency here.
      #
      # The hand-written project embedded GamesRoomWatch.app via an "Embed
      # Watch Content" phase while declaring no dependency on it, so the watch
      # app was never actually built by this scheme — the embed copied whatever
      # happened to be lying around. Declaring the dependency (the correct fix)
      # makes xcodebuild refuse the scheme outright:
      #
      #   "This scheme builds an embedded Apple Watch app.
      #    watchOS 26.5 must be installed in order to run the scheme"
      #
      # macstudio has the watchOS 26.5 SDK but NOT the watchOS simulator
      # RUNTIME (only iOS 26.5 is installed), so no simulator build can satisfy
      # it. Restoring the dependency requires installing the runtime (~7 GB):
      #
      #   xcodebuild -downloadPlatform watchOS
      #
      # Until then this line stays commented and the latent staleness remains a
      # KNOWN issue rather than a silent one. Device/archive builds that must
      # ship a correct watch app should build GamesRoomWatch explicitly first.
      # - target: GamesRoomWatch

  GamesRoomWatch:
    type: application.watchapp2
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: GamesRoomWatch
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamesroom.app.watch
        PRODUCT_NAME: GamesRoomWatch
        INFOPLIST_FILE: GamesRoomWatch/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: GamesRoomWatch/GamesRoomWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: "YES"

  GamesRoomWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GamesRoomWidgets
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamesroom.app.widgets
        PRODUCT_NAME: GamesRoomWidgets
        INFOPLIST_FILE: GamesRoomWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: GamesRoomWidgets/GamesRoomWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"

  # Acceptance test target for the iPad sidebar tap regression
  # (builds 11/12). The previous fix "passed" a verification that
  # set `selectedRoom` programmatically and screenshotted the
  # detail pane — that tests the detail rendering, NOT that a
  # synthesized tap actually drives selection. This target exists
  # so the real gesture path is exercised in CI.
  #
  # Launched by `xcodebuild ... -only-testing:GamesRoomUITests
  #   -destination 'platform=iOS Simulator,name=iPad Air 11-inch (M4)'`.
  # The single test (`test_sidebarTapDrivesDetailPaneAndSecondTapSwitches`)
  # sets the `-screenshots-bypass-auth` launch arg so the app uses
  # the seeded `InMemoryRoomStore` instead of the live Supabase
  # store (no network on the simulator).
  GamesRoomUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GamesRoomUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamesroom.app.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: GamesRoom
    dependencies:
      - target: GamesRoom

schemes:
  GamesRoom:
    build:
      targets:
        GamesRoom: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GamesRoomUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
